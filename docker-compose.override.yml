# Демо-данные для презентации.
#
# Compose автоматически подхватывает этот файл поверх docker-compose.yml.
# Единственное назначение — включить опциональный DemoDataSeeder
# (config/DemoDataSeeder.java), который при старте бэка заполняет БД
# реалистичным набором: студенты Алматы, события, подписки, чаты, отзывы
# и история репутации. Сидер идемпотентен (повторный старт ничего не
# дублирует) и пишет только через обычный доменный слой.
#
# Чтобы вернуться к «чистому» запуску без демо-данных — удали этот файл
# (или поставь значение в "false") и пересоздай БД: `docker compose down -v`.
services:
  backend:
    environment:
      APPLICATION_SEED_DEMO_ENABLED: "true"
